<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">

        <div class="display">1+5 = 6</div>

        <div class="functions">
            <div class="f-button">C</div>
            <div class="f-button">+</div>
            <div class="f-button">-</div>
            <div class="f-button">*</div>
            <div class="f-button">/</div>
            <div class="f-button">=</div>
        </div>

        <div class="numbers">
            <div class="n-button">1</div>
            <div class="n-button">2</div>
            <div class="n-button">3</div>
            <div class="n-button">4</div>
            <div class="n-button">5</div>
            <div class="n-button">6</div>
            <div class="n-button">7</div>
            <div class="n-button">8</div>
            <div class="n-button">9</div>
            <div class="n-button">0</div>
        </div>

    </div>

</body>
</html>
